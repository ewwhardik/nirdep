# nirdep guarding nirdep, with the action in this repository.
#
# `uses: ./` is the point. The action in the root of this repo is run against this repo by this
# workflow, so the copy-paste block in the README is a thing that is already running rather than
# a thing that ought to work. If the action breaks, this is what goes red.
#
# checkout is CI infrastructure -- the code has to arrive somehow -- and setup-node is not used
# at all here, because the ubuntu-latest image already ships a Node this tool runs on and the
# action says so itself if it does not.

name: guard

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: this repo, guarded by its own action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The real thing, on the whole repository, with the policy that is committed beside it.
      - name: nirdep guard
        id: guard
        uses: ./

      # A green build above proves the exit code; this proves the number reached the outputs,
      # which is what anybody wiring the action into a larger job depends on.
      - name: The exit code is the product
        run: |
          set -euo pipefail
          echo "guard exited ${{ steps.guard.outputs.exit-code }}"
          test "${{ steps.guard.outputs.exit-code }}" = "0"

      # And the other half of the contract: a policy nobody can read fails the build rather than
      # passing it quietly. The file is written here rather than committed, because a broken
      # policy in the repository would break every other job that reads one.
      - name: A policy that cannot be read is not a pass
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/broken"
          cp package.json "$RUNNER_TEMP/broken/package.json"
          printf '{ "guard": { "signal": ["imported"] } }\n' > "$RUNNER_TEMP/broken/.nirdeprc.json"
          code=0
          node bin/nirdep.mjs guard "$RUNNER_TEMP/broken" > "$RUNNER_TEMP/broken.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/broken.txt"
          test "$code" = "2"
